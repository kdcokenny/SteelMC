syntax = "proto3";

package steel.worldgen.v1;

option java_multiple_files = true;
option java_package = "dev.steelmc.worldgen.protocol.v1";
option java_outer_classname = "WorldgenProtocol";

service WorldGenService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc GetMetrics(GetMetricsRequest) returns (Metrics);
}

message GetCapabilitiesRequest {}
message GetMetricsRequest {}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_STRUCTURE_STARTS = 1;
  STAGE_STRUCTURE_REFERENCES = 2;
  STAGE_BIOMES = 3;
  STAGE_NOISE = 4;
  STAGE_SURFACE = 5;
  STAGE_CARVERS = 6;
  STAGE_FEATURES = 7;
  STAGE_LIGHT = 8;
  STAGE_FULL = 9;
}

enum Compression {
  COMPRESSION_UNSPECIFIED = 0;
  COMPRESSION_NONE = 1;
  COMPRESSION_ZSTD = 2;
}

enum HeightmapType {
  HEIGHTMAP_UNSPECIFIED = 0;
  HEIGHTMAP_WORLD_SURFACE = 1;
  HEIGHTMAP_MOTION_BLOCKING = 2;
  HEIGHTMAP_MOTION_BLOCKING_NO_LEAVES = 3;
  HEIGHTMAP_OCEAN_FLOOR = 4;
  HEIGHTMAP_WORLD_SURFACE_WG = 5;
  HEIGHTMAP_OCEAN_FLOOR_WG = 6;
}

enum GenerationContext {
  GENERATION_CONTEXT_UNSPECIFIED = 0;
  GENERATION_CONTEXT_FRESH = 1;
  GENERATION_CONTEXT_BLENDING = 2;
  GENERATION_CONTEXT_RETROGEN = 3;
}

message Capabilities {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  repeated uint32 artifact_versions = 3;
  string minecraft_version = 4;
  string steel_version = 5;
  string profile_id = 6;
  string dimension_key = 7;
  int64 seed = 8;
  int32 min_y = 9;
  uint32 height = 10;
  bytes generator_sha256 = 11;
  bytes registry_sha256 = 12;
  bytes profile_sha256 = 13;
  repeated Stage completed_stages = 14;
  repeated Compression compression = 15;
  uint32 max_request_bytes = 16;
  uint32 max_artifact_bytes = 17;
  uint32 max_in_flight = 18;
  bool supports_blending = 19;
  bool supports_retrogen = 20;
  bool steel_resumable = 21;
  string corresponding_source_url = 22;
  // Canonical digest of all compiled workspace crate sources, generated Rust, and extracted build assets.
  string source_sha256 = 23;
  string license_expression = 24;
  string external_build_id = 25;
  string rustc_id = 26;
  string cargo_id = 27;
  string build_target = 28;
  string build_configuration = 29;
  uint32 max_in_flight_per_peer = 30;
}

message GenerateRequest {
  bytes request_id = 1;
  string minecraft_version = 2;
  string profile_id = 3;
  string dimension_key = 4;
  int64 seed = 5;
  int32 chunk_x = 6;
  int32 chunk_z = 7;
  int32 min_y = 8;
  uint32 height = 9;
  Stage first_stage = 10;
  Stage last_stage = 11;
  bytes expected_generator_sha256 = 12;
  bytes expected_registry_sha256 = 13;
  repeated Compression accepted_compression = 14;
  GenerationContext generation_context = 15;
}

message GenerateResponse {
  bytes request_id = 1;
  bytes canonical_request_sha256 = 2;
  bytes generator_sha256 = 3;
  bytes registry_sha256 = 4;
  uint32 artifact_version = 5;
  Compression compression = 6;
  uint64 uncompressed_size = 7;
  bytes artifact_sha256 = 8;
  bytes artifact = 9;
  bool cache_hit = 10;
  StageTimings timings = 11;
}

message StageTimings {
  uint64 queue_micros = 1;
  uint64 generation_micros = 2;
  uint64 encode_micros = 3;
  uint64 total_micros = 4;
}

message CancelRequest {
  bytes request_id = 1;
  bytes canonical_request_sha256 = 2;
}

message CancelResponse {
  bool found = 1;
}

message Metrics {
  uint64 requests = 1;
  uint64 succeeded = 2;
  uint64 failed = 3;
  uint64 cancelled = 4;
  uint64 cache_hits = 5;
  uint64 in_flight = 6;
  bool poisoned = 7;
}

message ChunkArtifactV1 {
  uint32 artifact_version = 1;
  string minecraft_version = 2;
  bytes canonical_request_sha256 = 3;
  bytes generator_sha256 = 4;
  bytes registry_sha256 = 5;
  string dimension_key = 6;
  int64 seed = 7;
  int32 chunk_x = 8;
  int32 chunk_z = 9;
  int32 min_y = 10;
  uint32 height = 11;
  repeated Stage completed_stages = 12;
  repeated BlockState block_states = 13;
  repeated string biomes = 14;
  repeated ChunkSection sections = 15;
  // Contains only heightmaps owned by completed stages. NOISE V1 requires exactly
  // WORLD_SURFACE_WG and OCEAN_FLOOR_WG; final maps must not be synthesized.
  repeated Heightmap heightmaps = 16;
  repeated PostProcessingSection postprocessing = 17;
}

message BlockState {
  string name = 1;
  repeated BlockProperty properties = 2;
}

message BlockProperty {
  string name = 1;
  string value = 2;
}

message ChunkSection {
  int32 section_y = 1;
  PackedPalette block_states = 2;
  PackedPalette biomes = 3;
}

message PackedPalette {
  repeated uint32 entries = 1;
  uint32 bits_per_entry = 2;
  bytes data = 3;
}

message Heightmap {
  HeightmapType type = 1;
  repeated uint32 first_available_relative_to_min_y = 2 [packed = true];
}

message PostProcessingSection {
  int32 section_y = 1;
  repeated uint32 packed_offsets = 2 [packed = true];
}
